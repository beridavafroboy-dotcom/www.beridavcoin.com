<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BERIDAVCOIN - Advanced Mining & Asset Sweeper</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --secondary: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --bg-dark: #0b1220;
      --bg-darker: #060b16;
      --bg-card: #121b2d;
      --bg-card-hover: #1a2642;
      --border: #1d2a44;
      --text-primary: #e5eefb;
      --text-muted: #8ca3c7;
      --text-light: #a1b5d8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* ===== HEADER ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 11, 22, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-text strong {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand-text span {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--success);
      border-radius: 20px;
      font-size: 13px;
    }

    .status-pulse {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ===== LAYOUT ===== */
    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: calc(100vh - 70px);
    }

    /* ===== SIDEBAR ===== */
    nav {
      background: rgba(9, 16, 29, 0.8);
      backdrop-filter: blur(10px);
      border-right: 1px solid var(--border);
      padding: 20px 12px;
      overflow-y: auto;
      position: sticky;
      top: 70px;
      max-height: calc(100vh - 70px);
    }

    nav button {
      width: 100%;
      margin: 8px 0;
      padding: 14px 16px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: rgba(19, 32, 58, 0.6);
      color: var(--text-light);
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    nav button:hover {
      background: rgba(19, 32, 58, 1);
      border-color: var(--border);
      transform: translateX(4px);
    }

    nav button.active {
      background: linear-gradient(135deg, var(--primary), #1e40af);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    /* ===== MAIN CONTENT ===== */
    main {
      padding: 28px;
      overflow-y: auto;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== HERO SECTION ===== */
    .hero {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.1), rgba(124, 58, 237, 0.05));
      border: 1px solid rgba(37, 99, 235, 0.2);
      border-radius: 18px;
      padding: 32px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.1), transparent);
      border-radius: 50%;
      opacity: 0.5;
    }

    .hero h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .hero p {
      color: var(--text-muted);
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
      max-width: 600px;
    }

    /* ===== PILLS ===== */
    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0;
      position: relative;
      z-index: 1;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(37, 99, 235, 0.3);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #60a5fa;
    }

    /* ===== BUTTONS ===== */
    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    button.action {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: 0;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    button.action:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }

    button.action:active {
      transform: translateY(0);
    }

    button.secondary {
      background: rgba(34, 50, 79, 0.8);
      border: 1px solid var(--border);
      color: var(--text-light);
    }

    button.secondary:hover {
      background: rgba(34, 50, 79, 1);
      border-color: var(--primary);
    }

    button.success {
      background: linear-gradient(135deg, var(--success), #059669);
    }

    button.success:hover {
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
    }

    /* ===== CARDS ===== */
    .card {
      background: linear-gradient(135deg, var(--bg-card), rgba(18, 27, 45, 0.5));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.05), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover {
      background: linear-gradient(135deg, var(--bg-card-hover), rgba(26, 38, 66, 0.5));
      border-color: rgba(37, 99, 235, 0.3);
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.1);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 16px;
    }

    /* ===== GRID ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .grid.grid-3 {
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .grid.grid-2 {
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    }

    /* ===== STAT CARD ===== */
    .stat-card {
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.05), transparent);
      text-align: center;
    }

    .stat-card h3 {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .stat-card .value {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-card .sub {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 8px;
    }

    /* ===== PROGRESS BAR ===== */
    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(37, 99, 235, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-bar > div {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #7c3aed);
      border-radius: 10px;
      transition: width 0.5s ease;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
    }

    /* ===== PRE CODE ===== */
    pre {
      background: rgba(6, 11, 22, 0.8);
      padding: 16px;
      border-radius: 12px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border);
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #60a5fa;
      line-height: 1.6;
    }

    /* ===== LISTS ===== */
    ul, ol {
      margin: 12px 0 12px 24px;
    }

    li {
      margin: 8px 0;
      color: var(--text-light);
      list-style: disc;
    }

    li strong {
      color: var(--text-primary);
    }

    /* ===== SECTION ===== */
    .section {
      margin-top: 24px;
    }

    /* ===== ALERT ===== */
    .alert {
      padding: 16px;
      border-radius: 12px;
      border-left: 4px solid;
      margin: 16px 0;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .alert.success {
      background: rgba(16, 185, 129, 0.1);
      border-color: var(--success);
      color: #6ee7b7;
    }

    .alert.warning {
      background: rgba(245, 158, 11, 0.1);
      border-color: var(--secondary);
      color: #fbbf24;
    }

    .alert.info {
      background: rgba(37, 99, 235, 0.1);
      border-color: var(--primary);
      color: #60a5fa;
    }

    /* ===== MEDIA QUERIES ===== */
    @media (max-width: 768px) {
      .layout {
        grid-template-columns: 1fr;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 12px;
        position: relative;
        top: auto;
        max-height: none;
      }

      nav button {
        flex: 1;
        min-width: 100px;
      }

      header {
        flex-direction: column;
        gap: 12px;
      }

      main {
        padding: 16px;
      }

      .hero {
        padding: 20px;
      }

      .hero h1 {
        font-size: 24px;
      }

      .grid, .grid.grid-3, .grid.grid-2 {
        grid-template-columns: 1fr;
      }

      .stat-card .value {
        font-size: 28px;
      }

      .button-group {
        flex-direction: column;
      }

      button.action {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .pills {
        flex-direction: column;
      }

      .pill {
        width: 100%;
        justify-content: flex-start;
      }

      .stat-card .value {
        font-size: 24px;
      }

      .hero h1 {
        font-size: 20px;
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-darker);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(37, 99, 235, 0.5);
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="brand">
    <div class="brand-icon">
      <i class="fas fa-cube"></i>
    </div>
    <div class="brand-text">
      <strong>BERIDAVCOIN</strong>
      <span>⛏️ Mining • 🔍 Asset Sweeper</span>
    </div>
  </div>
  <div class="header-status">
    <div class="status-pulse"></div>
    <span id="statusTop">Initializing...</span>
  </div>
</header>

<!-- LAYOUT -->
<div class="layout">
  <!-- SIDEBAR -->
  <nav>
    <button class="active" onclick="showPage('home', this)">
      <i class="fas fa-home"></i> Home
    </button>
    <button onclick="showPage('mining', this)">
      <i class="fas fa-gem"></i> Mining
    </button>
    <button onclick="showPage('asset', this)">
      <i class="fas fa-search"></i> Asset Sweeper
    </button>
    <button onclick="showPage('wallet', this)">
      <i class="fas fa-wallet"></i> Wallet
    </button>
    <button onclick="showPage('reports', this)">
      <i class="fas fa-chart-line"></i> Reports
    </button>
    <button onclick="showPage('distributions', this)">
      <i class="fas fa-share-alt"></i> Distributions
    </button>
  </nav>

  <!-- MAIN CONTENT -->
  <main id="content"></main>
</div>

<script>
let currentPage = "home";
let miner = { 
  level: 1, 
  balance: 0, 
  sessionGain: 0,
  totalGain: 0,
  hashRate: 0,
  powerLevel: 100
};
let assetSweeperResults = [];
let chartInstance = null;

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// ===== MINING FUNCTIONS =====
function mineStep() {
  const baseReward = 10 + Math.random() * 20;
  const levelBonus = miner.level * 2;
  const powerBonus = (miner.powerLevel / 100) * 5;
  const gain = Math.round((baseReward + levelBonus + powerBonus) * 100) / 100;
  
  miner.balance += gain;
  miner.sessionGain += gain;
  miner.totalGain += gain;
  miner.hashRate = Math.floor((50 + miner.level * 15 + Math.random() * 50));
  
  if (Math.floor(miner.balance / 500) > miner.level - 1) {
    miner.level++;
    miner.powerLevel = Math.min(100, miner.powerLevel + 10);
  }
  
  if (miner.powerLevel < 100) {
    miner.powerLevel = Math.min(100, miner.powerLevel + 2);
  }
  
  return gain;
}

function turboMine() {
  let totalGain = 0;
  for (let i = 0; i < 10; i++) {
    totalGain += mineStep();
  }
  miner.powerLevel = Math.max(0, miner.powerLevel - 30);
  return totalGain;
}

// ===== ASSET SWEEPER =====
function runAssetSweep() {
  assetSweeperResults = [];
  
  const numAssets = Math.floor(Math.random() * 8) + 3;
  for (let i = 0; i < numAssets; i++) {
    const unclaimed = Math.round(Math.random() * 200 * 100) / 100;
    const source = ['Wallet', 'Exchange', 'Bridge', 'Pool', 'LP', 'Staking', 'Reward'][Math.floor(Math.random() * 7)];
    const status = unclaimed > 50 ? 'HIGH_VALUE' : unclaimed > 20 ? 'MEDIUM' : 'LOW';
    
    if (unclaimed > 0) {
      assetSweeperResults.push({
        id: `ASSET_${i}`,
        source,
        amount: unclaimed,
        status,
        timestamp: new Date().toLocaleTimeString(),
        claimable: true
      });
    }
  }
  
  return assetSweeperResults;
}

function claimAsset(id) {
  const asset = assetSweeperResults.find(a => a.id === id);
  if (asset && asset.claimable) {
    miner.balance += asset.amount;
    miner.sessionGain += asset.amount;
    asset.claimable = false;
    renderAssetSweeper();
  }
}

// ===== CHART FUNCTIONS =====
function updateChart() {
  const canvas = document.getElementById("trendChart");
  if (!canvas) return;

  if (chartInstance) chartInstance.destroy();
  
  const data = [];
  for (let i = 0; i < 10; i++) {
    data.push(Math.max(0, miner.balance - (20 - i * 2)));
  }

  chartInstance = new Chart(canvas, {
    type: "line",
    data: {
      labels: Array.from({length: 10}, (_, i) => `${i}s`),
      datasets: [{
        label: "BERI Balance",
        data,
        borderColor: "#2563eb",
        backgroundColor: "rgba(37, 99, 235, 0.1)",
        borderWidth: 3,
        tension: 0.4,
        fill: true,
        pointRadius: 5,
        pointBackgroundColor: "#2563eb",
        pointBorderColor: "#fff",
        pointBorderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: {
          labels: { color: "#e5eefb", font: { size: 12, weight: 600 } }
        }
      },
      scales: {
        x: {
          ticks: { color: "#8ca3c7" },
          grid: { color: "rgba(29, 42, 68, 0.3)" }
        },
        y: {
          ticks: { color: "#8ca3c7" },
          grid: { color: "rgba(29, 42, 68, 0.3)" }
        }
      }
    }
  });
}

// ===== PAGE RENDERING =====
function renderAssetSweeper() {
  const results = assetSweeperResults.map(asset => {
    const statusColor = asset.status === 'HIGH_VALUE' ? '#10b981' : asset.status === 'MEDIUM' ? '#f59e0b' : '#8ca3c7';
    return `
      <div class="card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <div>
          <strong>${asset.source}</strong>
          <div style="color: #8ca3c7; font-size: 12px; margin-top: 4px;">
            Found: <span style="color: ${statusColor}; font-weight: 700;">${asset.amount} BERI</span>
            <span style="color: #8ca3c7;">${asset.status}</span>
            <span style="color: #8ca3c7;">${asset.timestamp}</span>
          </div>
        </div>
        <button class="action" ${!asset.claimable ? 'disabled style="opacity: 0.5;"' : ''} onclick="claimAsset('${asset.id}')">
          ${asset.claimable ? '✓ Claim' : '✓ Claimed'}
        </button>
      </div>
    `;
  }).join('');

  document.getElementById("assetResults").innerHTML = results || '<p style="color: #8ca3c7;">Waiting for scan results...</p>';
}

function showPage(page, btn) {
  currentPage = page;
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  if (btn) btn.classList.add("active");

  const content = document.getElementById("content");

  if (page === "home") {
    content.innerHTML = `
      <section class="hero">
        <h1>🚀 Advanced Blockchain Mining & Asset Recovery</h1>
        <p>Enterprise-grade mining automation with real-time asset sweeper scanning. Maximize your BERI holdings with intelligent automation.</p>
        <div class="pills">
          <div class="pill">⛏️ Multi-Level Mining</div>
          <div class="pill">💰 Auto-Optimization</div>
          <div class="pill">🔍 Smart Sweeper</div>
          <div class="pill">📊 Live Analytics</div>
          <div class="pill">🔋 Power System</div>
          <div class="pill">💎 Reward Boosts</div>
        </div>
        <div class="button-group">
          <button class="action" onclick="showPage('mining')">
            <i class="fas fa-play"></i> Start Mining
          </button>
          <button class="action success" onclick="showPage('asset')">
            <i class="fas fa-search"></i> Run Sweeper
          </button>
          <button class="action secondary" onclick="showPage('reports')">
            <i class="fas fa-chart-bar"></i> View Reports
          </button>
        </div>
      </section>

      <div class="grid grid-3">
        <div class="stat-card">
          <h3>💰 Current Balance</h3>
          <div class="value" id="homeBalance">0.00</div>
          <div class="sub">Session: <span id="homeSession">0.00</span> BERI</div>
          <div class="progress-bar"><div id="balanceProgress" style="width: 0%"></div></div>
        </div>
        <div class="stat-card">
          <h3>⛏️ Miner Level</h3>
          <div class="value" id="homeLevel">1</div>
          <div class="sub">Hash Rate: <span id="homeHash">0</span> MH/s</div>
          <div class="progress-bar"><div id="levelProgress" style="width: 0%"></div></div>
        </div>
        <div class="stat-card">
          <h3>🔋 Power Level</h3>
          <div class="value" id="homePower">100%</div>
          <div class="sub">Regenerating...</div>
          <div class="progress-bar"><div id="powerProgress" style="width: 100%"></div></div>
        </div>
      </div>

      <div class="grid grid-2">
        <div class="card">
          <h3><i class="fas fa-info-circle"></i> Quick Actions</h3>
          <button class="action" onclick="mineStep(); updateHome();" style="width: 100%; margin-top: 10px;">
            <i class="fas fa-gem"></i> Mine Once
          </button>
          <button class="action" onclick="turboMine(); updateHome();" style="width: 100%; margin-top: 10px;">
            <i class="fas fa-lightning-bolt"></i> Turbo Mine (x10)
          </button>
          <button class="action secondary" onclick="runAssetSweep(); showPage('asset');" style="width: 100%; margin-top: 10px;">
            <i class="fas fa-search"></i> Scan Assets
          </button>
        </div>

        <div class="card">
          <h3><i class="fas fa-stats"></i> System Status</h3>
          <div class="alert success">
            <i class="fas fa-check-circle"></i>
            <div>Mining Engine: <strong>ACTIVE</strong></div>
          </div>
          <div class="alert info">
            <i class="fas fa-info-circle"></i>
            <div>Asset Scanner: <strong>READY</strong></div>
          </div>
          <div class="alert success">
            <i class="fas fa-check-circle"></i>
            <div>Auto-Optimization: <strong>ENABLED</strong></div>
          </div>
        </div>

function updateHome() {
  document.getElementById("homeBalance").innerText = miner.balance.toFixed(2);
  document.getElementById("homeSession").innerText = miner.sessionGain.toFixed(2);
  document.getElementById("homeLevel").innerText = miner.level;
  document.getElementById("homeHash").innerText = miner.hashRate;
  document.getElementById("homePower").innerText = miner.powerLevel + "%";
  document.getElementById("balanceProgress").style.width = Math.min(100, (miner.balance / 1000) * 100) + "%";
  document.getElementById("levelProgress").style.width = Math.min(100, ((miner.balance % 500) / 500) * 100) + "%";
  document.getElementById("powerProgress").style.width = miner.powerLevel + "%";
}

showPage("home");

setInterval(() => {
  document.getElementById("statusTop").innerText = "System Active • Mining Running";
}, 2000);

setInterval(() => {
  mineStep();
  if (currentPage === "home") updateHome();
  if (currentPage === "mining") showPage("mining");
}, 5000);
